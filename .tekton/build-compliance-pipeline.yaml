apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-npm-compliance
  labels:
    # Conforma pipeline-required-tasks selector (see plumbing/policy-data/).
    pipelines.openshift.io/runtime: build-npm-compliance
spec:
  description: |
    npm Trusted Libraries — on-push rebuild + compliance pipeline.
    Identifies packages from the merge (HEAD^), rebuilds via build-npm-package-oci-ta,
    then assess-npm-compliance-oci-ta (SPDX verify + TL compliance sidecars) and
    pushes a durable :<sha>.npm snapshot. Does not promote on-pr OCI.
  params:
    - name: git-url
      type: string
    - name: revision
      type: string
      default: ""
    - name: output-image
      description: Durable Quay tag prefix; npm packages land at $(output-image).npm
      type: string
    - name: image-expires-after
      description: Empty for durable snapshot tags
      type: string
      default: ""
    - name: prev-packages-ref
      type: string
      default: "HEAD^"
    - name: git-clone-depth
      type: string
      default: "0"
    - name: builder-image
      description: Pinned npm-builder (identify scripts + BUILDER_IMAGE for build/assess)
      type: string
    - name: task-build-npm-package-bundle
      description: Tekton bundle image for build-npm-package-oci-ta
      type: string
    - name: task-assess-npm-compliance-bundle
      description: >-
        Tekton bundle image for assess-npm-compliance-oci-ta
        (Quay component still named task-promote-npm-oci)
      type: string
    - name: publish-to-pulp
      description: When true, also npm publish to Pulp Stage (future; requires stage secret)
      type: string
      default: "false"
    - name: pulp-npm-registry-url
      description: Pulp Stage npm registry URL (only when publish-to-pulp is true)
      type: string
      default: ""
    - name: npm-publish-secret-name
      type: string
      default: rhtl-pulp-npm-stage-credentials
    - name: skip-checks
      type: string
      default: "false"
    - name: rebuild
      type: string
      default: "false"
  results:
    - name: IMAGE_URL
      value: $(tasks.assess-npm-compliance.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.assess-npm-compliance.results.IMAGE_DIGEST)
    - name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
  tasks:
    - name: init
      params:
        - name: image-url
          value: $(params.output-image)
        - name: rebuild
          value: $(params.rebuild)
        - name: skip-checks
          value: $(params.skip-checks)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:7854d7babe4136e53e337f6433d952532314433b48bb62b422ddc02700934d85
          - name: kind
            value: task
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: fetchTags
          value: "true"
        - name: depth
          value: $(params.git-clone-depth)
        - name: ociStorage
          value: $(params.output-image).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:a3678910c2bf9187a66a96066193cb41046fbb7097160bf2be6a374ed5e49d30
          - name: kind
            value: task
      workspaces:
        - name: basic-auth
          workspace: git-auth
    - name: identify-packages
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: SCRIPT
          value: |
            ./hack/identify-packages '$(params.prev-packages-ref)' "${SCRIPT_OUTPUT_ARRAY}" "${SCRIPT_OUTPUT}"
        - name: SCRIPT_RUNNER_IMAGE
          value: $(params.builder-image)
        - name: HERMETIC
          value: "true"
        - name: ociStorage
          value: $(params.output-image).pkgs
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: run-script-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-run-script-oci-ta:0.1.3@sha256:ec40c7fd8efeb80c92e45c62b1acaff4a0c1882c3edd4bd14710e4115787e907
          - name: kind
            value: task
    - name: build-npm-package
      runAfter:
        - identify-packages
      when:
        - input: "$(tasks.identify-packages.results.SCRIPT_OUTPUT)"
          operator: in
          values: ["has-packages"]
      params:
        - name: PACKAGES
          value: $(tasks.identify-packages.results.SCRIPT_OUTPUT_ARRAY)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: BUILDER_IMAGE
          value: $(params.builder-image)
        - name: IMAGE
          value: $(params.output-image).npm
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: PULP_NPM_REGISTRY_URL
          value: $(params.pulp-npm-registry-url)
        - name: NPM_PUBLISH_SECRET_NAME
          value: $(params.npm-publish-secret-name)
        - name: PUBLISH_TO_PULP
          value: $(params.publish-to-pulp)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: build-npm-package-oci-ta
          - name: bundle
            value: $(params.task-build-npm-package-bundle)
          - name: kind
            value: task
    - name: assess-npm-compliance
      runAfter:
        - build-npm-package
      when:
        - input: "$(tasks.identify-packages.results.SCRIPT_OUTPUT)"
          operator: in
          values: ["has-packages"]
      params:
        - name: SOURCE_IMAGE
          value: $(tasks.build-npm-package.results.IMAGE_REF)
        - name: IMAGE
          value: $(params.output-image).npm
        - name: BUILDER_IMAGE
          value: $(params.builder-image)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: PACKAGES
          value: $(tasks.identify-packages.results.SCRIPT_OUTPUT_ARRAY)
        - name: PACKAGES_STATUS
          value: $(tasks.identify-packages.results.SCRIPT_OUTPUT)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: assess-npm-compliance-oci-ta
          - name: bundle
            value: $(params.task-assess-npm-compliance-bundle)
          - name: kind
            value: task
  workspaces:
    - name: git-auth
      optional: true
