apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/calungaproject/npm-registry?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: >
      event == "push" && target_branch == "main" &&
      files.all.exists(x, x.matches('^packages/') && !x.matches('(^|/)README(\\.md)?$'))
    # Independent promotes per merge; avoid snapshot supersession skipping releases.
    test.appstudio.openshift.io/ignore-supersession: "true"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: calunga-npm-registry-main
    appstudio.openshift.io/component: calunga-npm-registry-main
    pipelines.appstudio.openshift.io/type: build
    # Conforma pipeline-required-tasks selector (fallback if build Task lacks build_type).
    pipelines.openshift.io/runtime: promote-npm
  name: calunga-npm-registry-main-on-push
  namespace: calunga-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/calunga-tenant/calunga-npm-registry-main:{{revision}}
    - name: source-npm-image
      value: quay.io/redhat-user-workloads/calunga-tenant/calunga-npm-registry-main:on-pr-{{pull_request_number}}.npm
    - name: prev-packages-ref
      value: 'HEAD^'
    - name: git-clone-depth
      value: "0"
    - name: builder-image
      value: quay.io/redhat-user-workloads/calunga-tenant/npm-builder:53e7598873004200daeee652eb8a1b4f65edfdbc@sha256:15b646a01cdfeef84504dec0bb601ad4d3d8d78db0c09c8f34e05454dcd1c93e
    - name: task-promote-npm-oci-bundle
      value: quay.io/redhat-user-workloads/calunga-tenant/task-promote-npm-oci:98f9a71e1d1590ff0356eec9b4c7f61454b86e24@sha256:d8d5f548773cc44a04a519f815b92590635f829206d89396c3c71d8e2c92813c
  taskRunTemplate:
    serviceAccountName: build-pipeline-calunga-npm-registry-main
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
  pipelineRef:
    name: promote-npm
  taskRunSpecs:
    - pipelineTaskName: promote-npm-oci
      computeResources:
        requests:
          memory: 2Gi
        limits:
          memory: 4Gi
status: {}
