apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/calungaproject/npm-registry?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: >
      event == "push" && target_branch == "main" &&
      files.all.exists(x, x.matches('^packages/') && !x.matches('(^|/)README(\\.md)?$'))
    # Independent rebuilds per merge; avoid snapshot supersession skipping releases.
    test.appstudio.openshift.io/ignore-supersession: "true"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: calunga-npm-registry-main
    appstudio.openshift.io/component: calunga-npm-registry-main
    pipelines.appstudio.openshift.io/type: build
    # Conforma pipeline-required-tasks selector (fallback if build Task lacks build_type).
    pipelines.openshift.io/runtime: build-npm-compliance
  name: calunga-npm-registry-main-on-push
  namespace: calunga-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/calunga-tenant/calunga-npm-registry-main:{{revision}}
    - name: prev-packages-ref
      value: 'HEAD^'
    - name: git-clone-depth
      value: "0"
    - name: builder-image
      value: quay.io/redhat-user-workloads/calunga-tenant/npm-builder:4223587b7123d8c7d5a4b2ff8b5253b8076a1c06@sha256:8705cb985e00a236673a384cbdf7a0deaeeca3d359e611fdb8bc23b321ae5755
    - name: task-build-npm-package-bundle
      value: quay.io/redhat-user-workloads/calunga-tenant/task-build-npm-package:8efe12cc3fe2cd0825888ec5a198cc55871320cb@sha256:89d5c491ef5efe3aaebae9182a190a9eeb5352fd6b549d1855ad38c6ca549cf7
    # Quay component name remains task-promote-npm-oci (Task: assess-npm-compliance-oci-ta).
    - name: task-assess-npm-compliance-bundle
      value: quay.io/redhat-user-workloads/calunga-tenant/task-promote-npm-oci:4223587b7123d8c7d5a4b2ff8b5253b8076a1c06@sha256:73e9b4cc00094e24f024bdb7e68cc2d346edefffad9e27a931c018fa964df682
  taskRunTemplate:
    serviceAccountName: build-pipeline-calunga-npm-registry-main
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
  pipelineRef:
    name: build-npm-compliance
  taskRunSpecs:
    - pipelineTaskName: build-npm-package
      computeResources:
        requests:
          memory: 8Gi
        limits:
          memory: 12Gi
    - pipelineTaskName: assess-npm-compliance
      computeResources:
        requests:
          memory: 2Gi
        limits:
          memory: 4Gi
status: {}
