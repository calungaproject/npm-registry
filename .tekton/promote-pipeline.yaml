apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: promote-npm
  labels:
    # Conforma pipeline-required-tasks selector (see plumbing/policy-data/).
    pipelines.openshift.io/runtime: promote-npm
spec:
  description: |
    npm Trusted Libraries — on-push promote pipeline.
    Identifies packages from the merge (HEAD^), promotes the matching
    on-pr-<pr-number>.npm Quay OCI artifact to a durable :<sha>.npm snapshot
    (verify SPDX SBOM + assess compliance). No rebuild.
  params:
    - name: git-url
      type: string
    - name: revision
      type: string
      default: ""
    - name: output-image
      description: Durable Quay tag prefix; npm packages land at $(output-image).npm
      type: string
    - name: source-npm-image
      description: >-
        PR OCI artifact to promote (…:on-pr-<pr-number>.npm). Must exist from a
        green on-pr build for the merged pull request.
      type: string
    - name: image-expires-after
      description: Empty for durable snapshot tags
      type: string
      default: ""
    - name: prev-packages-ref
      type: string
      default: "HEAD^"
    - name: git-clone-depth
      type: string
      default: "0"
    - name: builder-image
      description: Pinned npm-builder (identify scripts + promote verify/compliance)
      type: string
    - name: task-promote-npm-oci-bundle
      description: Tekton bundle image for promote-npm-oci-ta
      type: string
    - name: skip-checks
      type: string
      default: "false"
    - name: rebuild
      type: string
      default: "false"
  results:
    - name: IMAGE_URL
      value: $(tasks.promote-npm-oci.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.promote-npm-oci.results.IMAGE_DIGEST)
    - name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
  tasks:
    - name: init
      params:
        - name: image-url
          value: $(params.output-image)
        - name: rebuild
          value: $(params.rebuild)
        - name: skip-checks
          value: $(params.skip-checks)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:c6c414a3b5dcd827720f3443a128a02d27a0a5071ea3e4dc0063d578f1f73a74
          - name: kind
            value: task
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: fetchTags
          value: "true"
        - name: depth
          value: $(params.git-clone-depth)
        - name: ociStorage
          value: $(params.output-image).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:1d7ba568ae6e9e26800054f3942779de8abc80ddc48f0e44df6b1c2f098161dc
          - name: kind
            value: task
      workspaces:
        - name: basic-auth
          workspace: git-auth
    - name: identify-packages
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: SCRIPT
          value: |
            ./hack/identify-packages '$(params.prev-packages-ref)' "${SCRIPT_OUTPUT_ARRAY}" "${SCRIPT_OUTPUT}"
        - name: SCRIPT_RUNNER_IMAGE
          value: $(params.builder-image)
        - name: HERMETIC
          value: "true"
        - name: ociStorage
          value: $(params.output-image).pkgs
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: run-script-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-run-script-oci-ta:0.1.3@sha256:0de690663190de7012549b297b2d500499bd8b7350614a097bf1b242211c18f0
          - name: kind
            value: task
    - name: promote-npm-oci
      runAfter:
        - identify-packages
      params:
        - name: SOURCE_IMAGE
          value: $(params.source-npm-image)
        - name: IMAGE
          value: $(params.output-image).npm
        - name: BUILDER_IMAGE
          value: $(params.builder-image)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: PACKAGES
          value: $(tasks.identify-packages.results.SCRIPT_OUTPUT_ARRAY)
        - name: PACKAGES_STATUS
          value: $(tasks.identify-packages.results.SCRIPT_OUTPUT)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: promote-npm-oci-ta
          - name: bundle
            value: $(params.task-promote-npm-oci-bundle)
          - name: kind
            value: task
  workspaces:
    - name: git-auth
      optional: true
