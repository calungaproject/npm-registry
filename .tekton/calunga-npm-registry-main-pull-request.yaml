apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/calungaproject/npm-registry?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch == "main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: calunga-npm-registry-main
    appstudio.openshift.io/component: calunga-npm-registry-main
    pipelines.appstudio.openshift.io/type: build
    # Conforma pipeline-required-tasks selector (fallback if build Task lacks build_type).
    pipelines.openshift.io/runtime: build-npm
  name: calunga-npm-registry-main-on-pull-request
  namespace: calunga-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/calunga-tenant/calunga-npm-registry-main:on-pr-{{revision}}
    - name: image-expires-after
      value: 5d
    - name: prev-packages-ref
      value: 'origin/{{target_branch}}'
    - name: git-clone-depth
      value: "0"
    - name: builder-image
      value: quay.io/redhat-user-workloads/calunga-tenant/npm-builder:6d3502c8cc14874eb808ff9c6e63f4bd9ea37d94@sha256:9de06a22fd40563109fa6c758deb9d3b9f2bd56d173ad860c2d98c501da7d54a
    - name: task-build-npm-package-bundle
      value: quay.io/redhat-user-workloads/calunga-tenant/task-build-npm-package:a5b3aeae8568be78be3a6f0fe38a29e07c0d2e87@sha256:7eceb8501b752447be03fd1a91a8921732bf9a7143ea25331c60b717d2c6e683
  taskRunTemplate:
    serviceAccountName: build-pipeline-calunga-npm-registry-main
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
  pipelineRef:
    name: build-npm
  taskRunSpecs:
    - pipelineTaskName: build-npm-package
      computeResources:
        requests:
          memory: 8Gi
        limits:
          memory: 12Gi
status: {}
