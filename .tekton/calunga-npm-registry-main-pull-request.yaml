apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/calungaproject/npm-registry?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: >
      event == "pull_request" && target_branch == "main" &&
      files.all.exists(x, x.matches('^packages/') && !x.matches('(^|/)README(\\.md)?$'))
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: calunga-npm-registry-main
    appstudio.openshift.io/component: calunga-npm-registry-main
    pipelines.appstudio.openshift.io/type: build
    # Conforma pipeline-required-tasks selector (fallback if build Task lacks build_type).
    pipelines.openshift.io/runtime: build-npm
  name: calunga-npm-registry-main-on-pull-request
  namespace: calunga-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/calunga-tenant/calunga-npm-registry-main:on-pr-{{pull_request_number}}
    - name: image-expires-after
      value: 5d
    # Fork PR clones may not have origin/main; use the PR merge-base SHA from GitHub.
    - name: prev-packages-ref
      value: '{{ body.pull_request.base.sha }}'
    - name: git-clone-depth
      value: "0"
    - name: builder-image
      value: quay.io/redhat-user-workloads/calunga-tenant/npm-builder:98f9a71e1d1590ff0356eec9b4c7f61454b86e24@sha256:427e9952ae18cd2182a8f61246d8c78aef1c72d53ec753305c77b39f644547f2
    - name: task-build-npm-package-bundle
      value: quay.io/redhat-user-workloads/calunga-tenant/task-build-npm-package:8efe12cc3fe2cd0825888ec5a198cc55871320cb@sha256:89d5c491ef5efe3aaebae9182a190a9eeb5352fd6b549d1855ad38c6ca549cf7
  taskRunTemplate:
    serviceAccountName: build-pipeline-calunga-npm-registry-main
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
  pipelineRef:
    name: build-npm
  taskRunSpecs:
    - pipelineTaskName: build-npm-package
      computeResources:
        requests:
          memory: 8Gi
        limits:
          memory: 12Gi
status: {}
